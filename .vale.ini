# Vale lints the prose-core rule on project docs and Python comments and docstrings. The Prose
# style is deployed by skills-deploy (vale:Prose in .claude/project.json); edit it in
# Devops/skill-library/vale/styles/Prose.
# CHANGELOG.md, UPSTREAM-README.md, CLAUDE.md and AGENTS.md are exempt (.context/voice.md).
StylesPath = .vale/styles
MinAlertLevel = warning

[{README.md,.context/*.md,DocVault/*.md,*.py}]
BasedOnStyles = Prose

# Specs and reviews may hold issue IDs. The hidden folders hold deployed copies.
[{DocVault/specs/**,DocVault/Reviews/**,tests/**,.claude/**,.agents/**,.codex/**}]
BasedOnStyles =
